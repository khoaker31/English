/* ==================== ACTIONS ==================== */
function updateStreak(){
  var today=new Date().toISOString().slice(0,10);
  if(S.streak.last===today) return;
  var yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.streak.last===yesterday) S.streak.count++;
  else S.streak.count=1;
  S.streak.last=today; save();
}
function markDoneCheck(l){
  if(isDone(l.id)){ celebrate(); updateStreak(); }
}

var mediaRecorder=null, recChunks=[];
function toggleRecord(){
  if(!(navigator.mediaDevices&&window.MediaRecorder)) return;
  if(S.recording){
    if(mediaRecorder&&mediaRecorder.state!=='inactive') mediaRecorder.stop();
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recChunks=[];
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=function(e){ if(e.data.size>0) recChunks.push(e.data); };
    mediaRecorder.onstop=function(){
      var blob=new Blob(recChunks,{type:'audio/webm'});
      if(S.recUrl) try{ URL.revokeObjectURL(S.recUrl); }catch(e){}
      S.recUrl=URL.createObjectURL(blob);
      S.recording=false;
      stream.getTracks().forEach(function(t){t.stop();});
      render();
    };
    mediaRecorder.start();
    S.recording=true; render();
  }).catch(function(){
    alert('Không thể truy cập micro. Vui lòng cấp quyền micro trong trình duyệt.');
  });
}

document.addEventListener('click', function(e){
  var el=e.target.closest('[data-action]');
  if(!el) return;
  var act=el.dataset.action;
  if(act==='nav'){ S.view=el.dataset.view; stopSpeak(); render(); }
  else if(act==='toggle-dark'){ S.dark=!S.dark; document.body.classList.toggle('dark',S.dark); render(); }
  else if(act==='filter'){ S.filter=el.dataset.filter; render(); }
  else if(act==='go-lesson'){ stopSpeak(); S.lessonId=parseInt(el.dataset.id); S.step=1; S.vocabIdx=0; S.flipped=false; S.answers={}; S.quizSubmitted=false; S.dictIdx=0; S.dictResults=[]; render(); }
  else if(act==='go-home'){ stopSpeak(); S.lessonId=null; render(); }
  else if(act==='go-step'){ stopSpeak(); S.step=parseInt(el.dataset.step); if(S.step===4){S.dictIdx=0;S.dictResults=[];} render(); }
  else if(act==='flip-card'){ S.flipped=!S.flipped; render(); }
  else if(act==='speak-word'){ speak(decodeURIComponent(el.dataset.text), S.speed); }
  else if(act==='prev-vocab'){ if(S.vocabIdx>0){S.vocabIdx--;S.flipped=false;render();} }
  else if(act==='next-vocab'){ var l=cur(); if(S.vocabIdx<l.vocab.length-1){S.vocabIdx++;S.flipped=false;render();} }
  else if(act==='toggle-known'){ var k=el.dataset.key; S.known[k]=!S.known[k]; if(S.known[k]){ srsAdd(k); } else { delete S.known[k]; delete S.srs[k]; } save(); render(); }
  else if(act==='go-review'){ S.view='vocab'; S.reviewMode=true; S.reviewList=srsDue(); S.reviewIdx=0; render(); }
  else if(act==='review-start'){ S.reviewMode=true; S.reviewList=srsDue(); S.reviewIdx=0; render(); }
  else if(act==='review-exit'){ S.reviewMode=false; render(); }
  else if(act==='review-reveal'){ var rm=document.getElementById('reviewMeaning'); if(rm) rm.style.display='block'; }
  else if(act==='review-known'){ if(S.reviewList[S.reviewIdx]) srsReview(S.reviewList[S.reviewIdx], true); S.reviewIdx++; render(); }
  else if(act==='review-unknown'){ if(S.reviewList[S.reviewIdx]) srsReview(S.reviewList[S.reviewIdx], false); S.reviewIdx++; render(); }
  else if(act==='toggle-reminder'){ S.reminderOn=!S.reminderOn; if(S.reminderOn && 'Notification' in window && Notification.permission==='default'){ try{ Notification.requestPermission(); }catch(e){} } save(); render(); }
  else if(act==='set-accent'){ S.accent=el.dataset.accent; save(); render(); }
  else if(act==='toggle-persona'){ S.personaVoice=!S.personaVoice; save(); render(); }
  else if(act==='set-persona-context'){ S.personaContext=(el.dataset.v==='1'); save(); render(); }
  else if(act==='toggle-persona-emotion'){ S.personaEmotion=!S.personaEmotion; save(); render(); }
  else if(act==='test-persona'){ speakPersonaDemo(el.dataset.key); }
  else if(act==='toggle-dict-mode'){ S.dictMode=(S.dictMode==='full'?'gap':'full'); S.dictIdx=0; S.dictResults=[]; render(); }
  else if(act==='finish-step1'){ var p=prog(S.lessonId); p.s1=true; S.progress[S.lessonId]=p; save(); S.step=2; render(); }
  else if(act==='play-all'){ playSeq(cur(), 0); }
  else if(act==='stop-play'){ stopSpeak(); render(); }
  else if(act==='play-one'){ stopSpeak(); var di=parseInt(el.dataset.idx), dtxt=cur().dialogue[di].t, dr=S.repeatCount||1, dd=0; (function dloop(){ speakAs(dtxt, cur().dialogue[di].sp, S.speed, function(){ dd++; if(dd<dr){ setTimeout(dloop,350); } }, cur()); })(); }
  else if(act==='pick-answer'){ if(S.quizSubmitted) return; S.answers[parseInt(el.dataset.qi)]=parseInt(el.dataset.oi); render(); }
  else if(act==='submit-quiz'){
    var l2=cur(); var sc=l2.quiz.filter(function(q,i){return S.answers[i]===q.a;}).length;
    S.quizSubmitted=true; var p2=prog(l2.id); p2.s2=sc; S.progress[l2.id]=p2; save(); render();
  }
  else if(act==='toggle-trans'){ S.showTrans=!S.showTrans; render(); }
  else if(act==='set-speed'){ S.speed=parseFloat(el.dataset.speed); save(); render(); }
  else if(act==='set-repeat'){ S.repeatCount=parseInt(el.dataset.repeat); render(); }
  else if(act==='finish-step3'){ var p3=prog(S.lessonId); p3.s3=true; S.progress[S.lessonId]=p3; save(); S.step=4; S.dictIdx=0; S.dictResults=[]; render(); }
  else if(act==='record-toggle'){ toggleRecord(); }
  else if(act==='dict-play'){ speak(cur().dialogue[parseInt(el.dataset.idx)].t, S.speed); }
  else if(act==='dict-submit'){
    var inp=document.getElementById('dictInput');
    var userTxt=inp?inp.value.trim():'';
    var l4=cur(), total=Math.min(3,l4.dialogue.length), idx=Math.min(S.dictIdx,total-1);
    var correct=l4.dialogue[idx].t;
    var norm=function(s){return s.toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ').trim();};
    var pct;
    if(S.dictMode==='gap'){
      var gw=pickGapWord(correct);
      pct=(norm(userTxt)===norm(gw||''))?100:0;
      S.dictResults[idx]={user:userTxt||'(trống)', pct:pct, gap:gw};
    } else {
      var uW=norm(userTxt).split(' ').filter(Boolean), cW=norm(correct).split(' ');
      var match=0; cW.forEach(function(w){ if(uW.indexOf(w)!==-1) match++; });
      pct=Math.round(match/cW.length*100);
      S.dictResults[idx]={user:userTxt||'(trống)', pct:pct};
    }
    render();
  }
  else if(act==='dict-next'){ S.dictIdx++; render(); setTimeout(function(){var i=document.getElementById('dictInput'); if(i) i.focus();},50); }
  else if(act==='finish-step4'){
    var p4=prog(S.lessonId); p4.s4=true; S.progress[S.lessonId]=p4;
    var _ld=cur(), _today=new Date().toISOString().slice(0,10);
    S.history[_today]=(S.history[_today]||0)+(_ld?_ld.minutes:5); save();
    var ldone=cur(); markDoneCheck(ldone);
    S.lessonId=null; render();
  }
  else if(act==='test-voice'){ speak('Hello! This is a test of the English voice. How are you today?', S.speed); }
  else if(act==='toggle-listen-only'){ S.listenOnly=!S.listenOnly; render(); }
  else if(act==='export-data'){ var blob=new Blob([JSON.stringify({progress:S.progress,known:S.known,streak:S.streak},null,2)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mochi-progress.json'; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},100); }
  else if(act==='import-data'){ var f=document.getElementById('importFile'); if(f) f.click(); }
  else if(act==='reset-progress'){
    if(confirm('Bạn có chắc muốn xóa TOÀN BỘ tiến độ học? Hành động này không thể hoàn tác.')){
      S.progress={}; S.known={}; S.streak={count:0,last:''}; save(); render();
    }
  }
  try{ saveSettings(); }catch(e){}
});
/* voice select change */
document.addEventListener('change', function(e){
  if(e.target && e.target.id==='voiceSelect'){ S.voiceURI=e.target.value; save(); try{saveSettings();}catch(e){} }
});
/* search input */
document.addEventListener('input', function(e){
  if(e.target && e.target.id==='searchInput'){
    S.search=e.target.value; render();
    var si=document.getElementById('searchInput');
    if(si){ si.focus(); try{ si.setSelectionRange(si.value.length,si.value.length); }catch(err){} }
  }
});
/* reminder time change */
document.addEventListener('change', function(e){
  if(e.target && e.target.id==='reminderTime'){ S.reminderHour=e.target.value; save(); try{saveSettings();}catch(e){} }
});
/* reminder interval */
setInterval(function(){
  if(!S.reminderOn) return;
  var now=new Date(), hm=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
  var today=now.toISOString().slice(0,10);
  if(hm===S.reminderHour && S.remindedToday!==today){
    S.remindedToday=today;
    if('Notification' in window && Notification.permission==='granted'){ try{ new Notification('Mochi Listen Pro', {body:'Đến giờ học tiếng Anh rồi!'}); }catch(e){} }
  }
}, 30000);
/* import file */
document.addEventListener('change', function(e){
  if(e.target && e.target.id==='importFile'){
    var file=e.target.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){ try{ var data=JSON.parse(ev.target.result); if(data.progress) S.progress=data.progress; if(data.known) S.known=data.known; if(data.streak) S.streak=data.streak; save(); render(); alert('Đã nhập tiến độ thành công!'); }catch(err){ alert('File không hợp lệ.'); } };
    reader.readAsText(file);
  }
});
/* initial render */
if(S.dark) document.body.classList.add('dark');
render();
})();
</script>
</body>
</html>
