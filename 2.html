<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f0c29" />
<title>POWERLIFTING ELITE PROTOCOL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
:root{--primary:#dc2626;--primary-lite:#ef4444;--secondary:#16a34a;--warning:#f59e0b;--blue:#3b82f6;--ease:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,sans-serif;background:#0a0817;color:#f3f4f6;min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#1e293b}
::-webkit-scrollbar-thumb{background:#4b5563;border-radius:3px}

.bg-app{
  background:
    radial-gradient(ellipse at 20% 0%, rgba(220,38,38,.12) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(59,130,246,.10) 0%, transparent 55%),
    linear-gradient(135deg,#0a0817 0%,#141126 50%,#0f0c29 100%);
  min-height:100vh;
}

.protocol-header{
  background:linear-gradient(135deg,#141126,#0f0c29);
  border-bottom:1px solid rgba(220,38,38,.3);
  position:sticky;top:0;z-index:40;
  box-shadow:0 2px 12px rgba(0,0,0,.5);
}
.protocol-header::after{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#dc2626,#3b82f6,#16a34a,#f59e0b);
}

.mg-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:.66rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.chest-badge{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.35)}
.back-badge{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.35)}
.shoulders-badge{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.35)}
.legs-badge{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.35)}
.arms-badge{background:rgba(168,85,247,.15);color:#a78bfa;border:1px solid rgba(168,85,247,.35)}
.core-badge{background:rgba(6,182,212,.15);color:#22d3ee;border:1px solid rgba(6,182,212,.35)}
.forearms-badge{background:rgba(249,115,22,.15);color:#fdba74;border:1px solid rgba(249,115,22,.35)}

.tech-badge{font-size:.62rem;padding:3px 7px;border-radius:5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;display:inline-block;margin-top:4px}
.tech-dropset{background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid rgba(239,68,68,.5)}
.tech-pause{background:rgba(59,130,246,.18);color:#93c5fd;border:1px solid rgba(59,130,246,.5)}
.tech-slowecc{background:rgba(16,185,129,.18);color:#6ee7b7;border:1px solid rgba(16,185,129,.5)}
.tech-restpause{background:rgba(245,158,11,.18);color:#fcd34d;border:1px solid rgba(245,158,11,.5)}
.tech-superset{background:rgba(139,92,246,.18);color:#c4b5fd;border:1px solid rgba(139,92,246,.5)}
.tech-tempo{background:rgba(249,115,22,.18);color:#fed7aa;border:1px solid rgba(249,115,22,.5)}
.tech-default{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2)}

.card{background:linear-gradient(145deg,rgba(30,27,53,.9),rgba(20,17,38,.9));border-radius:16px;border:1px solid rgba(255,255,255,.08);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.workout-card{background:linear-gradient(145deg,rgba(30,27,53,.85),rgba(20,17,38,.85));border-radius:16px;border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 14px rgba(0,0,0,.25);padding:16px;margin-bottom:14px;position:relative;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.workout-card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.workout-card.completed{border-color:rgba(22,163,74,.4);background:linear-gradient(145deg,rgba(22,163,74,.08),rgba(20,17,38,.9))}
.workout-card.completed::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--secondary)}

.section-red{background:linear-gradient(135deg,rgba(220,38,38,.12),rgba(239,68,68,.05));border-radius:14px;padding:16px;margin:14px 0;border-left:4px solid var(--primary)}
.section-blue{background:rgba(59,130,246,.08);border-radius:14px;padding:14px;margin:12px 0;border-left:3px solid var(--blue)}
.section-yellow{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(251,191,36,.05));border-radius:14px;padding:16px;margin:14px 0;border-left:4px solid var(--warning)}
.section-green{background:rgba(16,185,129,.07);border-radius:14px;padding:14px;margin:12px 0;border-left:3px solid var(--secondary)}

.cycle-week{display:flex;align-items:center;padding:9px 12px;border-radius:10px;margin-bottom:6px;background:rgba(30,27,53,.7);border:1px solid rgba(255,255,255,.05);font-size:.82rem}
.week-intensity{font-weight:800;color:var(--warning);margin-right:10px;min-width:62px;font-size:.8rem}
.week-focus{flex:1;color:#f3f4f6;font-weight:600;font-size:.85rem}
.week-deload{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}
.week-strength{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3)}
.week-hypertrophy{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.3)}

button{transition:all .15s var(--ease);font-family:inherit;cursor:pointer;border:none;color:inherit}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-lite));color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;letter-spacing:.2px;box-shadow:0 3px 10px rgba(220,38,38,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(220,38,38,.45)}
.btn-success{background:linear-gradient(135deg,var(--secondary),#059669);color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;box-shadow:0 3px 10px rgba(16,185,129,.3)}
.btn-success:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(16,185,129,.45)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#dc2626);color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;box-shadow:0 3px 10px rgba(239,68,68,.3)}

.exercise-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.exercise-icon{color:var(--primary);margin-right:6px}
.completion-dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.1);transition:all .25s var(--ease)}
.completion-dot.completed{background:var(--secondary);border-color:var(--secondary);box-shadow:0 0 8px rgba(34,197,94,.7)}
.exercise-completion-indicator{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}

.set-row{display:flex;align-items:center;margin-bottom:7px;padding:9px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);flex-wrap:wrap;gap:6px;transition:background .15s var(--ease)}
.set-row:hover{background:rgba(255,255,255,.06)}
.set-row.completed{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25)}
.set-number{font-weight:800;min-width:28px;color:#e5e7eb;font-size:.88rem}
.set-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:7px 9px;color:#fff;width:64px;font-size:.88rem;font-weight:600;transition:all .15s var(--ease)}
.set-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(220,38,38,.2);background:rgba(220,38,38,.08)}
.set-input::placeholder{color:rgba(255,255,255,.3);font-weight:500}

.rpe-indicator{font-size:.65rem;background:rgba(220,38,38,.18);color:#fca5a5;padding:3px 6px;border-radius:5px;border:1px solid rgba(220,38,38,.3);font-weight:800;white-space:nowrap}
.one-rm-estimate{font-size:.65rem;background:linear-gradient(135deg,rgba(250,204,21,.18),rgba(245,158,11,.18));color:#fde047;padding:3px 7px;border-radius:5px;border:1px solid rgba(250,204,21,.4);font-weight:800;white-space:nowrap}
.one-rm-max{font-size:.78rem;background:linear-gradient(135deg,rgba(250,204,21,.25),rgba(249,115,22,.25));color:#fef08a;padding:5px 11px;border-radius:7px;margin-top:8px;border:1px solid rgba(250,204,21,.6);font-weight:900;display:inline-block}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:12px;padding:11px 18px;border-radius:10px;color:#fff;font-weight:600;z-index:1200;transform:translateX(150%);transition:transform .35s var(--ease);max-width:min(340px,calc(100vw - 24px));box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:.88rem;border:1px solid rgba(255,255,255,.15)}
.toast.show{transform:translateX(0)}
.toast.success{background:linear-gradient(135deg,#16a34a,#22c55e)}
.toast.error{background:linear-gradient(135deg,#dc2626,#ef4444)}
.toast.info{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.toast.warning{background:linear-gradient(135deg,#d97706,#f59e0b)}

.rest-timer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1730;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:1100;text-align:center;min-width:270px;max-width:calc(100vw - 32px);border:2px solid var(--primary);animation:pop-in .3s var(--ease)}
@keyframes pop-in{from{transform:translate(-50%,-50%) scale(.9);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.rest-timer.hidden{display:none}
.rest-timer .exercise-name{font-size:.95rem;font-weight:800;margin-bottom:4px;color:#f3f4f6;text-transform:uppercase;letter-spacing:.3px}
.rest-timer .next-ex{font-size:.72rem;color:#9ca3af;margin-bottom:12px}
.rest-timer .time{font-size:3.6rem;font-weight:900;margin-bottom:18px;font-family:'Roboto Condensed',sans-serif;letter-spacing:2px;color:#fff}
.rest-progress-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:16px}
.rest-progress-fill{height:100%;background:linear-gradient(90deg,#dc2626,#f59e0b);transition:width 1s linear;border-radius:3px}

.modal-bg{background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:14px;position:fixed;inset:0;z-index:50;animation:fade-in .2s ease-out}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal-content{animation:slide-up .3s var(--ease);max-height:90vh;display:flex;flex-direction:column;background:#1a1730}
@keyframes slide-up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}

.energy-dot{width:34px;height:34px;border-radius:50%;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem;color:rgba(0,0,0,.65);transition:all .2s var(--ease)}
.energy-dot.low{background:linear-gradient(135deg,#dc2626,#ef4444)}
.energy-dot.medium{background:linear-gradient(135deg,#d97706,#f59e0b)}
.energy-dot.high{background:linear-gradient(135deg,#16a34a,#22c55e)}
.energy-dot.selected{transform:scale(1.18);box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.energy-dot:hover{transform:scale(1.08)}

.ai-card{background:linear-gradient(135deg,rgba(220,38,38,.1),rgba(239,68,68,.04));border-radius:14px;padding:16px;margin:14px 0;border-left:4px solid var(--primary)}
.ai-card-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:800;font-size:.85rem;color:#fff;letter-spacing:.2px}
.ai-card-title i{color:var(--primary);font-size:1.05rem}
.ai-card p{color:#d1d5db;font-size:.82rem;line-height:1.55;margin-bottom:3px}

.week-indicator{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.week-box{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;color:#fff;border:1px solid rgba(255,255,255,.1);position:relative}
.week-box.active{transform:scale(1.1);box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.week-box.completed{background:linear-gradient(135deg,#16a34a,#22c55e)}
.week-box.completed::after{content:"✓";position:absolute;top:-4px;right:-4px;background:#fff;color:#16a34a;width:15px;height:15px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:900}
.week-box.upcoming{background:rgba(255,255,255,.06);color:#9ca3af}
.week-box.deload{background:linear-gradient(135deg,#d97706,#f59e0b)}
.week-box.strength{background:linear-gradient(135deg,#dc2626,#ef4444)}
.week-box.hypertrophy{background:linear-gradient(135deg,#2563eb,#3b82f6)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#141126;border-top:1px solid rgba(255,255,255,.08);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.4)}
.bottom-nav-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;border-radius:10px;color:#9ca3af;font-size:.6rem;font-weight:700;letter-spacing:.3px;background:transparent;text-transform:uppercase;gap:3px;position:relative}
.nav-item i{font-size:1.05rem;transition:transform .2s var(--ease)}
.nav-item.active{color:#fff;background:linear-gradient(135deg,rgba(220,38,38,.18),rgba(239,68,68,.08))}
.nav-item.active i{color:var(--primary);transform:scale(1.08)}
.nav-item.active::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;border-radius:0 0 2px 2px;background:var(--primary)}

.prev-workout{background:rgba(255,255,255,.03);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.78rem;border:1px solid rgba(255,255,255,.06);color:#9ca3af}
.auto-reg-panel{background:rgba(59,130,246,.08);border-radius:12px;padding:12px;margin:10px 0;border-left:3px solid var(--blue)}
.exercise-time{font-size:.7rem;color:#9ca3af;margin-top:5px;display:flex;align-items:center;gap:4px}
.intensity-tech{font-size:.72rem;color:var(--warning);margin-top:6px;font-weight:600;display:flex;align-items:flex-start;gap:5px;line-height:1.4}
.tech-box{border-left:3px solid var(--warning);background:rgba(245,158,11,.08);padding:12px;margin-top:10px;border-radius:0 10px 10px 0;font-size:.83rem;line-height:1.55;color:#d1d5db}
.glow-effect{box-shadow:0 0 14px rgba(220,38,38,.5),0 0 0 1px rgba(220,38,38,.4)}

.vol-tracker{background:rgba(16,185,129,.06);border-radius:12px;padding:14px;margin:12px 0;border-left:3px solid var(--secondary)}
.muscle-vol{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:5px 0;font-size:.8rem}
.vol-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:3px;overflow:hidden;width:96px}
.vol-fill{height:100%;border-radius:3px;transition:width .5s var(--ease)}
.vol-fill.under{background:#3b82f6}
.vol-fill.optimal{background:#16a34a}
.vol-fill.over{background:#f59e0b}

.nutrition-card,.recovery-card{background:rgba(245,158,11,.06);border-radius:12px;padding:14px;margin:12px 0;border-left:3px solid var(--warning)}
.recovery-card{background:rgba(59,130,246,.06);border-left-color:var(--blue)}
.checklist-item{display:flex;align-items:center;margin-bottom:9px;cursor:pointer;padding:3px;border-radius:6px;font-size:.85rem}
.checklist-item:hover{background:rgba(255,255,255,.03)}
.checklist-item input{margin-right:10px;accent-color:var(--secondary);width:16px;height:16px;cursor:pointer;flex-shrink:0}
.checklist-item input:checked + span{text-decoration:line-through;opacity:.6}

.diff-ind{display:flex;gap:4px;margin-top:5px}
.diff-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15)}
.diff-dot.active{background:var(--warning)}

.big3-badge{background:linear-gradient(135deg,#f59e0b,#f97316);color:#000;padding:2px 8px;border-radius:5px;font-weight:900;font-size:.6rem;letter-spacing:.5px;margin-left:4px}
.ss-badge{background:linear-gradient(135deg,#8b5cf6,#a855f7);color:#fff;padding:2px 7px;border-radius:5px;font-weight:800;font-size:.58rem;margin-left:6px}

.one-rm-summary{background:linear-gradient(135deg,rgba(250,204,21,.12),rgba(245,158,11,.06));border-radius:14px;padding:16px;margin:14px 0;border:1px solid rgba(250,204,21,.25)}
.one-rm-summary-title{font-weight:800;color:#fde047;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:.85rem}

.streak-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:800}
.streak-badge i{font-size:.78rem}

.plate-visual{display:flex;align-items:center;justify-content:center;gap:3px;padding:14px;background:rgba(0,0,0,.3);border-radius:12px;margin:12px 0;min-height:76px;flex-wrap:wrap}
.plate{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.7rem;border-radius:6px;color:#fff;border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 -3px 6px rgba(0,0,0,.35)}
.plate.p25{width:54px;height:54px;background:linear-gradient(135deg,#16a34a,#22c55e)}
.plate.p20{width:58px;height:58px;background:linear-gradient(135deg,#2563eb,#3b82f6)}
.plate.p15{width:50px;height:50px;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#000}
.plate.p10{width:44px;height:44px;background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.plate.p5{width:38px;height:38px;background:linear-gradient(135deg,#dc2626,#ef4444)}
.plate.p2-5{width:34px;height:34px;background:linear-gradient(135deg,#6b7280,#9ca3af)}
.plate.p1-25{width:30px;height:30px;background:linear-gradient(135deg,#9ca3af,#d1d5db);color:#000}
.plate-bar{width:70px;height:7px;background:linear-gradient(90deg,#4b5563,#9ca3af);border-radius:4px;margin:0 4px}

.confetti{position:fixed;width:9px;height:9px;top:-10px;pointer-events:none;z-index:2000;animation:confetti-fall linear forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

.spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.15);border-radius:50%;border-top-color:var(--primary);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

.error-banner{position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:12px 16px;z-index:9999;font-size:.82rem;border-bottom:2px solid #dc2626;max-height:50vh;overflow:auto;font-family:monospace;white-space:pre-wrap}

@media (max-width:640px){
  .exercise-header{flex-direction:column;gap:6px}
  .set-input{width:60px;padding:6px 8px}
  .rest-timer .time{font-size:3.2rem}
  .week-box{width:36px;height:36px;font-size:.8rem}
}
</style>
</head>
<body class="antialiased">

<!-- ===== GLOBAL ERROR BANNER (hidden by default) ===== -->
<div id="error-banner" class="error-banner" style="display:none"></div>

<div id="loading-overlay" class="fixed inset-0 bg-[#0a0817] flex items-center justify-center z-[200]">
  <div class="text-center">
    <div class="spinner mb-4"></div>
    <p class="text-white font-bold">Đang tải POWERLIFTING ELITE...</p>
    <p class="text-gray-500 text-xs mt-2">v3.1 • Stability Fix</p>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="rest-timer" class="rest-timer hidden">
  <div class="exercise-name" id="rt-exercise">Nghỉ giữa set</div>
  <div class="next-ex" id="rt-next"></div>
  <div class="time" id="rt-time">60s</div>
  <div class="rest-progress-bar"><div class="rest-progress-fill" id="rt-fill" style="width:100%"></div></div>
  <div class="flex gap-2">
    <button class="btn-danger py-3 px-3 rounded-xl flex-1 text-sm font-bold" onclick="REST.cancel()"><i class="fas fa-stop mr-1"></i>Hủy</button>
    <button class="btn-primary py-3 px-3 rounded-xl flex-1 text-sm font-bold" onclick="REST.add30()"><i class="fas fa-plus mr-1"></i>+30s</button>

/* ============ 1RM FORMULAS ============ */
var ONE_RM_FORMULAS = {
  epley:    { name:'Epley',    fn:function(w,r){return w*(1+r/30);} },
  brzycki:  { name:'Brzycki',  fn:function(w,r){return w*(36/(37-r));} },
  lombardi: { name:'Lombardi', fn:function(w,r){return w*Math.pow(r,0.1);} },
  mayhew:   { name:'Mayhew',   fn:function(w,r){return (100*w)/(52.2+41.9*Math.exp(-0.055*r));} },
  oconner:  { name:"O'Conner", fn:function(w,r){return w*(1+r/40);} }
};
function calculate1RM(w, r, formula){
  w = Number(w); r = Number(r);
  if (!w || !r || w<=0 || r<=0 || r>15) return null;
  if (r === 1) return Math.round(w);
  var fn = (ONE_RM_FORMULAS[formula]||ONE_RM_FORMULAS.epley).fn;
  var val = fn(w, r);
  return isFinite(val) ? Math.round(val) : null;
}

/* ============ STORAGE (debounced) ============ */
var saveTimer = null;
function saveAppState(immediate){
  if (saveTimer && !immediate) return;
  if (immediate){
    clearTimeout(saveTimer); saveTimer = null;
    doSave(); return;
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 400);
}
function doSave(){
  try{
    var toSave = {};
    for (var k in appState){
      if (k !== 'restTimerState') toSave[k] = appState[k];
    }
    localStorage.setItem('powerlifting-elite-state-v3', JSON.stringify(toSave));
  }catch(e){
    console.warn('Save failed', e);
    if (e.name === 'QuotaExceededError'){
      showToast('Bộ nhớ đầy! Hãy xoá lịch sử cũ.', 'warning');
    }
  }
}
function loadAppState(){
  try{
    var saved = localStorage.getItem('powerlifting-elite-state-v3');
    if (saved){
      var parsed = JSON.parse(saved);
      for (var key in parsed){
        if (key === 'settings' && parsed.settings){
          for (var sk in parsed.settings) appState.settings[sk] = parsed.settings[sk];
        } else if (key === 'recovery' && parsed.recovery){
          for (var rk in parsed.recovery) appState.recovery[rk] = parsed.recovery[rk];
        } else appState[key] = parsed[key];
      }
    }
  }catch(e){ console.warn('Load state failed', e); }
}

/* ============ HELPERS ============ */
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function showToast(msg, type){
  type = type || 'info';
  var toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ toast.classList.remove('show'); }, 2800);
}
function lockBodyScroll(lock){
  document.body.style.overflow = lock ? 'hidden' : '';
}
function closeModal(){
  var mc = document.getElementById('modal-container');
  if (mc) mc.innerHTML = '';
  lockBodyScroll(false);
}
function getEnergyLevelDescription(l){
  if (l<=3) return "Rất thấp – Cân nhắc giảm cường độ hoặc nghỉ";
  if (l<=5) return "Thấp – Giảm RPE mục tiêu xuống 1 điểm";
  if (l<=7) return "Trung bình – Tập với cường độ bình thường";
  if (l<=9) return "Cao – Có thể thử nghiệm cường độ cao hơn";
  return "Rất cao – Tối ưu cho tập luyện sức mạnh";
}
function getAutoRegulationAdvice(el){
  if (el<=5) return "Giảm RPE mục tiêu xuống 1 điểm. Tập trung kỹ thuật.";
  if (el<=7) return "Tập với RPE mục tiêu bình thường.";
  return "Có thể thử RPE cao hơn 0.5 điểm.";
}
function getCurrentWeekDescription(w){
  var cycle = strengthCycles[appState.settings.strengthCycle] || [];
  var wd = null;
  for (var i=0;i<cycle.length;i++){ if (cycle[i].week === w){ wd = cycle[i]; break; } }
  if (!wd) return "Đã hoàn thành chu kỳ – Bắt đầu chu kỳ mới!";
  return wd.type + ": " + wd.focus + " – " + wd.action;

function getMuscleGroupBadge(mg){
  var map = {"Ngực":"chest-badge","Lưng":"back-badge","Vai":"shoulders-badge",
    "Đùi trước":"legs-badge","Đùi sau":"legs-badge","Tay trước":"arms-badge",
    "Tay sau":"arms-badge","Bụng":"core-badge","Lưng dưới":"back-badge",
    "Bắp chân":"legs-badge","Cầu vai":"shoulders-badge","Cẳng tay":"forearms-badge","Mông":"legs-badge"};
  return '<span class="mg-badge ' + (map[mg]||'') + '">' + esc(mg) + '</span>';
}
function getTechniqueBadgeClass(t){
  var map = {"competition":"tech-dropset","pause":"tech-pause","deficit":"tech-slowecc",
    "closegrip":"tech-restpause","speed":"tech-tempo","superset":"tech-superset"};
  return map[t] || "tech-default";
}
function getExerciseDifficulty(rpeObj){
  var total=0, count=0;
  for (var s in rpeObj){ var v = parseFloat(rpeObj[s]); if (!isNaN(v)){ total+=v; count++; } }
  var avg = count>0 ? total/count : 7;
  if (avg>=9) return 5;
  if (avg>=8) return 4;
  if (avg>=7) return 3;
  return 2;
}
function renderDifficultyIndicator(d){
  var dots='';
  for (var i=1;i<=5;i++) dots += '<div class="diff-dot ' + (i<=d?'active':'') + '"></div>';
  return '<div class="diff-ind">' + dots + '</div>';
}
function calculateWeeklyVolume(){
  for (var m in weeklyVolumeTargets) weeklyVolumeTargets[m].current = 0;
  for (var i=0;i<6;i++){
    var dayKey = workoutDays[i];
    if (workoutPlan[dayKey]){
      workoutPlan[dayKey].forEach(function(e){
        if (weeklyVolumeTargets[e.muscleGroup]) weeklyVolumeTargets[e.muscleGroup].current += e.sets;
      });
    }
  }
}
function calculateCompletedVolume(){
  var volumes = {};
  for (var m in weeklyVolumeTargets) volumes[m] = 0;
  var cc = appState.cycle, cw = appState.settings.currentWeek;
  appState.workoutHistory.forEach(function(w){
    if (w.cycle === cc && w.week === cw){
      w.exercises.forEach(function(ex){
        var planEx = null;
        for (var i=0;i<FLAT_EX.length;i++){ if (FLAT_EX[i].name === ex.name){ planEx = FLAT_EX[i]; break; } }
        if (planEx && volumes[planEx.muscleGroup] !== undefined){
          var completedSets = (ex.sets||[]).filter(function(s){ return s.completed; }).length;
          volumes[planEx.muscleGroup] += completedSets;
        }
      });
    }
  });
  return volumes;
}

function calculateSuggestedWeight(exerciseName){
  if (!appState.workoutHistory || !appState.workoutHistory.length) return null;
  for (var i=appState.workoutHistory.length-1;i>=0;i--){
    var record = appState.workoutHistory[i];
    var exRecord = null;
    for (var j=0;j<record.exercises.length;j++){
      if (record.exercises[j].name === exerciseName){ exRecord = record.exercises[j]; break; }
    }
    if (exRecord && exRecord.sets && exRecord.sets.length){
      var bestWeight = 0, bestReps = 0;
      exRecord.sets.forEach(function(s){
        if (s.completed && s.weight){
          var w = parseFloat(s.weight);
          if (w > bestWeight){ bestWeight = w; bestReps = parseInt(s.reps) || 0; }
        }
      });
      if (bestWeight > 0){
        var cycle = strengthCycles[appState.settings.strengthCycle] || [];
        var currentPhase = cycle[appState.settings.currentWeek-1] || {type:"Volume"};
        var phaseType = currentPhase.type;
        var increase = 2.5;
        var reason = "Buổi trước: " + bestWeight + "kg × " + bestReps;
        if (phaseType === "Intensity" || phaseType === "Peak"){ increase = 1.25; reason += " → " + phaseType + ": tăng nhẹ"; }
        else if (phaseType === "Repmax + Deload"){ increase = -Math.round(bestWeight*0.4); reason += " → Tuần 5: giảm ~40%"; }
        else reason += " → Volume: +2.5kg nếu form tốt";
        var suggested = Math.max(20, Math.round((bestWeight+increase)*2)/2);
        return { suggested:suggested, lastWeight:bestWeight, phase:phaseType, reason:reason };
      }
    }
  }
  return null;
}
function getAllSuggestionsForCurrentDay(){
  var workout = workoutPlan[appState.currentWorkoutDay] || [];
  var result = [];
  workout.forEach(function(e){
    var s = calculateSuggestedWeight(e.name);
    if (s) result.push({ name:e.name, vietnameseName:e.vietnameseName||e.name, suggestion:s });
  });
  return result;
}
function getBest1RMForExercise(exerciseName){
  var progress = appState.workoutProgress[exerciseName];
  if (!progress || !progress.sets) return null;
  var best1RM = null;
  var formula = appState.settings.oneRMFormula || 'epley';
  progress.sets.forEach(function(s){
    if (s.weight && s.reps){
      var rm = calculate1RM(Number(s.weight), Number(s.reps), formula);
      if (rm !== null && (best1RM === null || rm > best1RM)) best1RM = rm;
    }
  });
  return best1RM;
}
function getSet1RM(si, exerciseKey){
  var progress = appState.workoutProgress[exerciseKey];
  if (!progress || !progress.sets || !progress.sets[si]) return null;
  var s = progress.sets[si];
  if (s.weight && s.reps){
    return calculate1RM(Number(s.weight), Number(s.reps), appState.settings.oneRMFormula||'epley');
  }
  return null;
}
function isAllTimePR(exerciseName, newRM){
  if (!newRM) return false;
  var best = 0;
  appState.workoutHistory.forEach(function(w){
    w.exercises.forEach(function(ex){
      if (ex.name === exerciseName && ex.best1RM && ex.best1RM > best) best = ex.best1RM;
    });
  });
  return newRM > best && best > 0;
}
function calculateStreak(){
  if (!appState.workoutHistory.length) return 0;
  var datesSet = {};
  appState.workoutHistory.forEach(function(w){
    datesSet[new Date(w.date).toDateString()] = true;
  });
  var dates = Object.keys(datesSet).map(function(d){ return new Date(d); }).sort(function(a,b){ return b-a; });
  if (!dates.length) return 0;
  var today = new Date(); today.setHours(0,0,0,0);
  var first = new Date(dates[0]); first.setHours(0,0,0,0);
  var diffDays = Math.floor((today - first)/(1000*60*60*24));
  if (diffDays > 1) return 0;
  var streak = 1;
  for (var i=1;i<dates.length;i++){
    var prev = new Date(dates[i-1]); prev.setHours(0,0,0,0);
    var curr = new Date(dates[i]); curr.setHours(0,0,0,0);
    if (Math.floor((prev-curr)/(1000*60*60*24)) === 1) streak++;
    else break;
  }
  return streak;
}

/* ============ 1RM LIVE UPDATE (debounced) ============ */
var prDebounce = {};
function updateSetDataAnd1RM(exerciseKey, si, field, value){
  if (!appState.workoutProgress[exerciseKey]) appState.workoutProgress[exerciseKey] = { sets:[] };
  if (!appState.workoutProgress[exerciseKey].sets[si]) appState.workoutProgress[exerciseKey].sets[si] = {};
  appState.workoutProgress[exerciseKey].sets[si][field] = value;
  saveAppState();
}
function update1RMDisplay(exerciseKey, si, parentElement){
  try{
    if (!parentElement) return;
    var inputs = parentElement.querySelectorAll('.set-input');
    if (inputs.length < 2) return;
    var w = inputs[0].value, r = inputs[1].value;
    if (!appState.workoutProgress[exerciseKey]) appState.workoutProgress[exerciseKey] = { sets:[] };
    if (!appState.workoutProgress[exerciseKey].sets[si]) appState.workoutProgress[exerciseKey].sets[si] = {};
    appState.workoutProgress[exerciseKey].sets[si].weight = w;
    appState.workoutProgress[exerciseKey].sets[si].reps = r;
    saveAppState();

    var safeKey = exerciseKey.replace(/[^a-zA-Z0-9]/g,'');
    var rmSpan = document.getElementById('rm-'+safeKey+'-'+si);
    if (rmSpan){
      var rm = getSet1RM(si, exerciseKey);
      if (rm){ rmSpan.textContent = '~'+rm+' kg 1RM'; rmSpan.style.display = 'inline-block'; }
      else { rmSpan.textContent = ''; rmSpan.style.display = 'none'; }
    }
    var maxRmSpan = document.getElementById('maxrm-'+safeKey);
    if (maxRmSpan){
      var best = getBest1RMForExercise(exerciseKey);
      if (best){ maxRmSpan.textContent = '🏆 1RM cao nhất: '+best+' kg'; maxRmSpan.style.display = 'inline-block'; }
      else maxRmSpan.style.display = 'none';
    }
    // PR check debounced
    var prKey = exerciseKey + '-' + si;
    clearTimeout(prDebounce[prKey]);
    prDebounce[prKey] = setTimeout(function(){
      var rm2 = getSet1RM(si, exerciseKey);
      if (rm2 && isAllTimePR(exerciseKey, rm2)){
        if (!parentElement.dataset.prShown){
          parentElement.dataset.prShown = '1';
          showToast('🎉 PR MỚI: '+rm2+'kg!', 'success');
          fireConfetti();
        }
      }
    }, 500);
  }catch(e){ console.warn('update1RM error', e); }
}

/* ============ PLATE CALCULATOR ============ */
function calculatePlates(totalWeight, barWeight){
  barWeight = barWeight || appState.settings.barWeight || 20;
  totalWeight = Number(totalWeight);
  if (!totalWeight || totalWeight < barWeight) return { perSide:[], error:'Nhẹ hơn thanh đòn' };
  var perSide = (totalWeight - barWeight) / 2;
  var availablePlates = [25, 20, 15, 10, 5, 2.5, 1.25];
  var result = [];
  for (var i=0;i<availablePlates.length;i++){
    var plate = availablePlates[i];
    while (perSide >= plate - 0.01){
      result.push(plate);
      perSide -= plate;
    }
  }
  return { perSide:result, remainder: Math.round(perSide*100)/100 };
}
function plateClass(p){
  return 'p' + String(p).replace('.', '-');
}
function showPlateCalculator(weight){
  var calc = calculatePlates(weight);
  var visual = calc.perSide.length
    ? calc.perSide.slice().sort(function(a,b){return b-a;}).map(function(p){
        return '<div class="plate '+plateClass(p)+'">'+p+'</div>';
      }).join('') + '<div class="plate-bar"></div>'
    : '<p style="color:#9ca3af;font-size:.85rem">Chỉ thanh đòn ('+appState.settings.barWeight+'kg)</p>';
  var html = '<div class="modal-bg" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal-content bg-gray-800 rounded-2xl w-full max-w-md">'+
    '<div class="p-5 border-b border-white/10 flex justify-between items-center">'+
    '<h2 class="text-lg font-bold text-white flex items-center gap-2"><i class="fas fa-calculator text-yellow-400"></i> Tính Đĩa Tạ</h2>'+
    '<button class="text-2xl text-gray-400 px-1" onclick="closeModal()">×</button></div>'+
    '<div class="p-5">'+
    '<input type="number" id="plate-weight-input" value="'+(weight||'')+'" placeholder="Nhập tổng kg" class="set-input text-center" style="font-size:1.4rem;font-weight:800;width:100%;padding:12px" oninput="recalcPlates()" />'+
    '<p style="font-size:.72rem;color:#9ca3af;margin-top:6px;text-align:center">Thanh đòn: '+appState.settings.barWeight+'kg</p>'+
    '<div class="plate-visual" id="plate-visual">'+visual+'</div>'+
    '<div id="plate-summary" style="text-align:center;font-size:.85rem;color:#d1d5db;margin-top:10px">'+
    (calc.perSide.length ? 'Mỗi bên: '+calc.perSide.join(' + ')+' kg' : 'Không cần đĩa')+'</div>'+
    '<div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.7rem;color:#9ca3af">'+
    '<div>🟢 25kg · 🔵 20kg · 🟡 15kg</div><div>🟣 10kg · 🔴 5kg · ⚪ 2.5kg</div></div>'+
    '</div>'+
    '<div class="p-5 border-t border-white/10"><button class="btn-primary w-full py-3" onclick="closeModal()">Đóng</button></div>'+
    '</div></div>';
  document.getElementById('modal-container').innerHTML = html;
  lockBodyScroll(true);
}
function recalcPlates(){
  try{
    var w = document.getElementById('plate-weight-input').value;
    var calc = calculatePlates(w);
    var visualEl = document.getElementById('plate-visual');
    var summaryEl = document.getElementById('plate-summary');
    if (!visualEl) return;
    if (calc.error){
      visualEl.innerHTML = '<p style="color:#9ca3af;font-size:.85rem">'+esc(calc.error)+'</p>';
      summaryEl.textContent = '';
      return;
    }
    if (calc.perSide.length === 0){
      visualEl.innerHTML = '<p style="color:#9ca3af;font-size:.85rem">Chỉ thanh đòn</p>';
    } else {
      visualEl.innerHTML = calc.perSide.slice().sort(function(a,b){return b-a;}).map(function(p){
        return '<div class="plate '+plateClass(p)+'">'+p+'</div>';
      }).join('') + '<div class="plate-bar"></div>';
    }
    summaryEl.textContent = calc.perSide.length ? 'Mỗi bên: '+calc.perSide.join(' + ')+' kg'+(calc.remainder>0?' (dư '+calc.remainder+'kg)':'') : 'Không cần đĩa';
  }catch(e){ console.warn(e); }
}

/* ============ CONFETTI (lightweight) ============ */
function fireConfetti(){
  var colors = ['#dc2626','#f59e0b','#16a34a','#3b82f6','#8b5cf6'];
  var frag = document.createDocumentFragment();
  for (var i=0;i<18;i++){
    var el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.8+Math.random()*1.5)+'s';
    el.style.animationDelay = (Math.random()*0.4)+'s';
    if (Math.random() > 0.5) el.style.borderRadius = '50%';
    frag.appendChild(el);
  }
  document.body.appendChild(frag);
  setTimeout(function(){
    document.querySelectorAll('.confetti').forEach(function(el){ el.remove(); });
  }, 4000);
}

/* ============ RENDER: EXERCISE ============ */
function getPreviousWorkoutExerciseHistory(exerciseName){
  for (var i=appState.workoutHistory.length-1;i>=0;i--){
    var w = appState.workoutHistory[i];
    for (var j=0;j<w.exercises.length;j++){
      if (w.exercises[j].name === exerciseName) return w.exercises[j];
    }
  }
  return null;
}
function renderPreviousWorkoutHistory(h){
  if (!h) return '';
  var html = '<div class="prev-workout"><div style="font-weight:700;color:#fbbf24;margin-bottom:3px">📊 Lần trước:</div>';
  h.sets.forEach(function(s,i){
    if (s.weight || s.reps){
      html += '<div>Set '+(i+1)+': '+(s.weight||'?')+'kg × '+(s.reps||'?')+'</div>';
    }
  });
  return html + '</div>';
}
function renderExerciseSets(exercise, exerciseKey){
  var ep = appState.workoutProgress[exerciseKey] || { sets:[] };
  var safeKey = exerciseKey.replace(/[^a-zA-Z0-9]/g,'');
  var html = '';
  for (var i=0;i<exercise.sets;i++){
    var sd = ep.sets[i] || { weight:'', reps:'' };
    var isC = sd.completed;
    var setRpe = exercise.rpe && exercise.rpe[i+1] ? exercise.rpe[i+1] : "8";
    var currentRM = getSet1RM(i, exerciseKey);
    var safeNameAttr = esc(exerciseKey).replace(/'/g, "\\'");
    html += '<div class="set-row '+(isC?'completed':'')+'">'+
      '<div class="set-number">'+(i+1)+'</div>'+
      '<span class="rpe-indicator">RPE '+setRpe+'</span>'+
      '<input type="number" inputmode="decimal" class="set-input" placeholder="Tạ" value="'+esc(sd.weight||'')+'" aria-label="Tạ" '+
        'oninput="update1RMDisplay(\''+safeNameAttr+'\','+i+',this.parentElement)" '+
        'onchange="updateSetDataAnd1RM(\''+safeNameAttr+'\','+i+',\'weight\',this.value)">'+
      '<span style="color:#9ca3af">×</span>'+
      '<input type="number" inputmode="numeric" class="set-input" placeholder="Reps" value="'+esc(sd.reps||'')+'" aria-label="Reps" '+

function getCurrentWorkoutProgress(){
  var workout = workoutPlan[appState.currentWorkoutDay] || [];
  if (!workout.length) return 0;
  var totalSets = 0, doneSets = 0;
  workout.forEach(function(e){
    totalSets += e.sets;
    var prog = appState.workoutProgress[e.name];
    if (prog && prog.sets) doneSets += prog.sets.filter(function(s){ return s.completed; }).length;
  });
  return totalSets > 0 ? Math.round((doneSets/totalSets)*100) : 0;
}
function renderVolumeTracker(){
  calculateWeeklyVolume();
  var completed = calculateCompletedVolume();
  var html = '<div class="vol-tracker"><h3 style="font-weight:800;color:#fff;margin-bottom:10px;font-size:.85rem"><i class="fas fa-chart-bar" style="color:#34d399;margin-right:6px"></i>Volume Tuần Này</h3>';
  var count = 0;
  for (var muscle in weeklyVolumeTargets){
    if (count++ >= 8) break;
    var data = weeklyVolumeTargets[muscle];
    var done = completed[muscle] || 0;
    var target = data.max;
    var pct = Math.min(100, (done/target)*100);
    var cls = 'under';
    if (done >= data.min && done <= data.max) cls = 'optimal';
    else if (done > data.max) cls = 'over';
    html += '<div class="muscle-vol"><div style="flex:1;min-width:0">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<span style="color:#fff;font-weight:500">'+esc(muscle)+'</span>'+
      '<span style="color:#9ca3af;font-size:.72rem;margin-left:8px">'+done+'/'+target+'</span></div>'+
      '<div class="vol-bar"><div class="vol-fill '+cls+'" style="width:'+pct+'%"></div></div></div></div>';
  }
  return html + '</div>';
}

function completeSet(ek, si){
  try{
    if (!appState.workoutProgress[ek]) appState.workoutProgress[ek] = { sets:[] };
    if (!appState.workoutProgress[ek].sets[si]) appState.workoutProgress[ek].sets[si] = {};
    appState.workoutProgress[ek].sets[si].completed = true;
    appState.workoutProgress[ek].sets[si].completionTime = new Date().toISOString();
    var exercise = null;
    var workout = workoutPlan[appState.currentWorkoutDay] || [];
    for (var i=0;i<workout.length;i++){ if (workout[i].name === ek){ exercise = workout[i]; break; } }
    if (exercise){
      var allDone = true;
      for (var j=0;j<exercise.sets;j++){
        if (!appState.workoutProgress[ek].sets[j] || !appState.workoutProgress[ek].sets[j].completed){ allDone = false; break; }
      }
      if (allDone){
        appState.workoutProgress[ek].completed = true;
        appState.workoutProgress[ek].completionTime = new Date().toISOString();
      }
    }
    var s = appState.workoutProgress[ek].sets[si];
    var rm = calculate1RM(s.weight, s.reps, appState.settings.oneRMFormula);
    if (rm && isAllTimePR(ek, rm)){
      showToast('🎉 PR MỚI: '+rm+'kg!', 'success');
      fireConfetti();
    } else {
      showToast('✓ Set '+(si+1), 'success');
    }
    saveAppState(true); renderApp();
  }catch(e){ console.error('completeSet', e); showToast('Lỗi!', 'error'); }
}
function undoSet(ek, si){
  try{
    if (appState.workoutProgress[ek] && appState.workoutProgress[ek].sets[si]){
      appState.workoutProgress[ek].sets[si].completed = false;
      appState.workoutProgress[ek].completed = false;
      saveAppState(true); renderApp();
      showToast('↺ Set '+(si+1), 'info');
    }
  }catch(e){ console.error(e); }
}
function completeWorkout(){
  try{
    var workout = workoutPlan[appState.currentWorkoutDay];
    if (!workout || !workout.length){ showToast('Ngày nghỉ!', 'info'); return; }
    var completed = workout.filter(function(ex){ return appState.workoutProgress[ex.name] && appState.workoutProgress[ex.name].completed; });
    if (!completed.length){ showToast('Chưa hoàn thành bài nào!', 'warning'); return; }
    var record = {
      date: new Date().toISOString(),
      day: appState.currentWorkoutDay,
      cycle: appState.cycle,
      week: appState.settings.currentWeek,
      exercises: completed.map(function(ex){
        return {
          name: ex.name,
          vietnameseName: ex.vietnameseName,
          sets: appState.workoutProgress[ex.name].sets,
          best1RM: getBest1RMForExercise(ex.name)
        };
      }),
      totalTime: calculateWorkoutTime(),
      energyLevel: appState.settings.energyLevel
    };
    appState.workoutHistory.push(record);
    appState.workoutProgress = {};
    appState.workoutStartTime = null;
    saveAppState(true); renderApp();
    showToast('🎉 Hoàn thành! '+completed.length+'/'+workout.length+' bài', 'success');
    showWorkoutSummary(record);
    if (completed.length >= workout.length * 0.8) fireConfetti();
  }catch(e){ console.error('completeWorkout', e); showToast('Lỗi!', 'error'); }
}
function calculateWorkoutTime(){
  if (!appState.workoutStartTime) return null;
  var diff = Math.floor((Date.now() - new Date(appState.workoutStartTime).getTime()) / 60000);
  return diff >= 60 ? Math.floor(diff/60)+'h '+(diff%60)+'m' : diff+'m';
}
function isWeek5Complete(){
  if (appState.settings.currentWeek < 5) return false;
  var days = {};
  appState.workoutHistory.forEach(function(w){
    if (w.cycle === appState.cycle && w.week === 5) days[w.day] = true;
  });
  return Object.keys(days).length >= 5;
}
function startNewCycle(){
  if (!isWeek5Complete()){
    if (!confirm('Bạn chưa hoàn thành đủ tuần 5. Tiếp tục?')) return;
  }
  if (confirm('Bắt đầu chu kỳ '+(appState.cycle+1)+'?')){
    appState.cycle++;
    appState.settings.currentWeek = 1;
    appState.workoutProgress = {};
    saveAppState(true); renderApp();
    showToast('🎉 Chu kỳ '+appState.cycle+'!', 'success');
    fireConfetti();
  }
}
function updateSetting(k, v){
  appState.settings[k] = v;
  saveAppState(true); renderApp();
  showToast('Đã lưu', 'success');
}

/* ============ REST TIMER ============ */
var REST = {
  interval: null,
  total: 0,
  remaining: 0,
  exerciseName: '',
  callback: null,
  start: function(seconds, exerciseKey){
    REST.cancel();
    REST.total = seconds;
    REST.remaining = seconds;
    var exercise = null;
    var workout = workoutPlan[appState.currentWorkoutDay] || [];
    for (var i=0;i<workout.length;i++){ if (workout[i].name === exerciseKey){ exercise = workout[i]; break; } }
    REST.exerciseName = exercise ? (exercise.vietnameseName || exercise.name) : 'Nghỉ';
    var el = document.getElementById('rest-timer');
    if (!el) return;
    el.classList.remove('hidden');
    var nameEl = document.getElementById('rt-exercise');
    var nextEl = document.getElementById('rt-next');
    var timeEl = document.getElementById('rt-time');
    var fillEl = document.getElementById('rt-fill');
    if (nameEl) nameEl.textContent = REST.exerciseName;
    if (nextEl) nextEl.textContent = 'Nghỉ '+seconds+' giây';
    if (timeEl) timeEl.textContent = REST.remaining+'s';
    if (fillEl) fillEl.style.width = '100%';
    REST.interval = setInterval(REST.tick, 1000);
  },
  tick: function(){
    REST.remaining--;
    if (REST.remaining < 0) REST.remaining = 0;
    var timeEl = document.getElementById('rt-time');
    var fillEl = document.getElementById('rt-fill');
    if (timeEl) timeEl.textContent = REST.remaining+'s';
    if (fillEl) fillEl.style.width = (REST.remaining/REST.total*100)+'%';
    if (REST.remaining <= 0){
      REST.cancel();
      playSound();
      showToast('⏰ Hết giờ nghỉ!', 'info');
      if (navigator.vibrate) try{ navigator.vibrate([200,100,200]); }catch(e){}
    }
  },
  cancel: function(){
    if (REST.interval){ clearInterval(REST.interval); REST.interval = null; }
    var el = document.getElementById('rest-timer');
    if (el) el.classList.add('hidden');
  },
  add30: function(){
    REST.remaining += 30;
    REST.total += 30;
    var timeEl = document.getElementById('rt-time');
    var fillEl = document.getElementById('rt-fill');
    if (timeEl) timeEl.textContent = REST.remaining+'s';
    if (fillEl) fillEl.style.width = (REST.remaining/REST.total*100)+'%';
  },
  done: function(){ REST.cancel(); }
};
function startRestTimer(seconds, exerciseKey){ REST.start(seconds, exerciseKey); }
function playSound(){
  if (!appState.settings.soundEnabled) return;
  try{
    var ac = new (window.AudioContext||window.webkitAudioContext)();
    [0, 0.2, 0.4].forEach(function(t, i){
      var osc = ac.createOscillator(), gn = ac.createGain();
      osc.connect(gn); gn.connect(ac.destination);
      osc.frequency.value = 800 + i*200; osc.type = 'sine';
      gn.gain.setValueAtTime(0.3, ac.currentTime + t);
      gn.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + t + 0.15);
      osc.start(ac.currentTime + t); osc.stop(ac.currentTime + t + 0.15);
    });
  }catch(e){}
}

function applySuggestionToExercise(exerciseName){
  try{
    var suggestion = calculateSuggestedWeight(exerciseName);
    if (!suggestion){ showToast('Chưa có đề xuất', 'info'); return; }
    if (!appState.workoutProgress[exerciseName]) appState.workoutProgress[exerciseName] = { sets:[] };
    var progress = appState.workoutProgress[exerciseName];
    var maxSets = 3;
    var workout = workoutPlan[appState.currentWorkoutDay] || [];
    for (var i=0;i<workout.length;i++){ if (workout[i].name === exerciseName){ maxSets = workout[i].sets; break; } }
    for (var j=0;j<maxSets;j++){
      if (!progress.sets[j] || !progress.sets[j].weight){
        if (!progress.sets[j]) progress.sets[j] = {};
        progress.sets[j].weight = suggestion.suggested;
        break;
      }
    }
    saveAppState(true); renderApp();
    showToast('Đã áp dụng '+suggestion.suggested+'kg', 'success');
  }catch(e){ console.error(e); }

function showProgressChart(){
  if (!appState.workoutHistory.length){ showToast('Chưa có dữ liệu!', 'info'); return; }
  if (typeof Chart === 'undefined'){
    showToast('Chart.js chưa tải. Thử lại sau!', 'warning');
    return;
  }
  var html = '<div class="modal-bg" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal-content bg-gray-800 rounded-2xl" style="padding:20px;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
    '<h2 style="font-size:1.05rem;font-weight:800;color:#fff"><i class="fas fa-chart-line" style="color:#ef4444;margin-right:6px"></i>Biểu Đồ 1RM</h2>'+
    '<button style="color:#9ca3af;font-size:1.5rem" onclick="closeModal()">×</button></div>'+
    '<select id="chart-exercise-select" style="background:#374151;color:#fff;border-radius:8px;padding:9px;width:100%;font-size:.82rem;border:none;margin-bottom:12px"></select>'+
    '<div style="flex:1;overflow-y:auto;position:relative;min-height:280px"><canvas id="progress-chart"></canvas></div>'+
    '<button class="btn-primary" style="width:100%;padding:11px;font-size:.82rem;margin-top:12px" onclick="closeModal()">Đóng</button>'+
    '</div></div>';
  document.getElementById('modal-container').innerHTML = html;
  lockBodyScroll(true);
  var exerciseNames = {};
  appState.workoutHistory.forEach(function(w){
    w.exercises.forEach(function(ex){ if (ex.best1RM) exerciseNames[ex.name] = true; });
  });
  var names = Object.keys(exerciseNames);
  var sel = document.getElementById('chart-exercise-select');
  if (sel && names.length){
    names.forEach(function(n){
      var opt = document.createElement('option');
      opt.value = n;
      var ex = null;
      for (var i=0;i<FLAT_EX.length;i++){ if (FLAT_EX[i].name === n){ ex = FLAT_EX[i]; break; } }
      opt.textContent = ex ? ex.vietnameseName : n;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function(){ renderProgressChart(this.value); });
    renderProgressChart(names[0]);
  }
}
var progressChartInstance = null;
function renderProgressChart(exerciseName){
  if (typeof Chart === 'undefined') return;
  var canvas = document.getElementById('progress-chart');
  if (!canvas) return;
  var data = [];
  appState.workoutHistory.forEach(function(w){
    var ex = null;
    for (var i=0;i<w.exercises.length;i++){ if (w.exercises[i].name === exerciseName && w.exercises[i].best1RM){ ex = w.exercises[i]; break; } }
    if (ex) data.push({ x: new Date(w.date).toLocaleDateString('vi-VN'), y: ex.best1RM });
  });
  if (progressChartInstance){ try{ progressChartInstance.destroy(); }catch(e){} progressChartInstance = null; }
  try{
    progressChartInstance = new Chart(canvas, {
      type:'line',
      data:{
        labels: data.map(function(d){ return d.x; }),
        datasets:[{
          label:'1RM (kg)',
          data: data.map(function(d){ return d.y; }),
          borderColor:'#dc2626',
          backgroundColor:'rgba(220,38,38,.15)',
          borderWidth:2.5,
          tension:0.35,
          fill:true,
          pointBackgroundColor:'#f59e0b',
          pointBorderColor:'#fff',
          pointBorderWidth:2,
          pointRadius:5
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#f3f4f6', font:{weight:'700'} } } },
        scales:{
          y:{ grid:{ color:'rgba(255,255,255,.06)' }, ticks:{ color:'#9ca3af' } },
          x:{ grid:{ display:false }, ticks:{ color:'#9ca3af' } }
        }
      }
    });
  }catch(e){
    console.warn('Chart render error', e);
    showToast('Không thể vẽ biểu đồ', 'error');
  }
}
function exportHistoryToHTML(){
  if (!appState.workoutHistory.length){ showToast('Chưa có lịch sử', 'info'); return; }
  var html = '<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Lịch Sử Powerlifting Elite</title>'+
    '<style>body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f5f5f7;color:#1f2937;line-height:1.5}'+
    'h1{color:#dc2626;border-bottom:3px solid #dc2626;padding-bottom:10px}'+
    '.workout{background:#fff;margin-bottom:24px;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}'+
    '.workout h2{margin:0 0 8px;font-size:1.2rem}'+
    '.meta{color:#6b7280;font-size:.85rem;margin-bottom:12px}'+
    '.exercise{margin:12px 0;padding:12px;background:#f9fafb;border-radius:8px;border-left:3px solid #dc2626}'+
    '.exercise.big3{background:#fef3c7;border-left-color:#f59e0b}'+
    '.exercise h3{margin:0 0 8px;font-size:1rem}'+
    '.set{display:flex;gap:20px;font-size:.9rem;color:#4b5563;padding:3px 0}'+
    '.rm{color:#d97706;font-weight:800}.cycle{color:#dc2626;font-weight:700;font-size:.75rem}</style></head><body>'+
    '<h1>⚡ Lịch Sử Powerlifting Elite</h1>'+
    '<p style="color:#6b7280">Xuất ngày '+new Date().toLocaleDateString('vi-VN')+' · Tổng '+appState.workoutHistory.length+' buổi</p>';
  appState.workoutHistory.slice().reverse().forEach(function(w){
    html += '<div class="workout"><div class="cycle">Chu kỳ '+(w.cycle||'?')+' · Tuần '+(w.week||'?')+'</div>'+
      '<h2>'+esc(w.day)+'</h2>'+
      '<div class="meta">'+new Date(w.date).toLocaleString('vi-VN')+' · '+(w.totalTime||'—')+' · Năng lượng '+w.energyLevel+'/10</div>'+
      w.exercises.map(function(ex){
        return '<div class="exercise '+(ex.name.indexOf('Competition')!==-1?'big3':'')+'">'+
          '<h3>'+esc(ex.vietnameseName||ex.name)+(ex.best1RM?' <span class="rm">· 1RM: '+ex.best1RM+'kg</span>':'')+'</h3>'+
          ex.sets.map(function(s,i){ return '<div class="set"><span>Set '+(i+1)+'</span><span>'+(s.weight||'?')+' kg</span><span>'+(s.reps||'?')+' reps</span></div>'; }).join('')+
          '</div>';
      }).join('')+'</div>';
  });
  html += '</body></html>';
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'powerlifting-history-'+new Date().toISOString().split('T')[0]+'.html';
  a.click();
  showToast('✓ Đã xuất file!', 'success');
}
